default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "onepager_development")  %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", " onepager_test")  %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "onepager_production")  %>
